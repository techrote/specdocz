name: Validate research library

on:
  push:
    paths:
      - 'README.md'
      - 'research/**'
      - 'scripts/validate_research.py'
      - '.github/workflows/research-validate.yml'
  pull_request:
    paths:
      - 'README.md'
      - 'research/**'
      - 'scripts/validate_research.py'
      - '.github/workflows/research-validate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate catalog, source IDs, and relative links
        run: python scripts/validate_research.py
